  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

      } catch (error) {

      }
      const forceManualBlur = new URLSearchParams(diagnosticSearch).has(&#x27;manual-blur&#x27;);

      function selectedLayer() {

      function hexToRgb(hex) {
        const value = parseInt(hex.slice(1), 16);
        return [(value &gt;&gt; 16) &amp; 255, (value &gt;&gt; 8) &amp; 255, value &amp; 255];
      }

      function thresholdToExpansion(threshold) {
        return 256 - threshold;
      }

      function expansionToThreshold(expansion) {
        return 256 - expansion;

      function paintSolidLogo(target, maskContext, width, height) {
        const result = target.createImageData(width, height);
        const maskData = maskContext.getImageData(0, 0, width, height).data;
        const logoRgb = hexToRgb(layers[0].color);
        const backgroundEnabled = backgroundToggle.checked;
        const backgroundRgb = hexToRgb(backgroundColorInput.value);
        for (let sourceIndex = 0, dataIndex = 0; sourceIndex &lt; maskData.length; sourceIndex += 4, dataIndex += 4) {
          const coverage = maskData[sourceIndex] / 255;
          if (backgroundEnabled) {
            result.data[dataIndex] = Math.round(logoRgb[0] * coverage + backgroundRgb[0] * (1 - coverage));
            result.data[dataIndex + 1] = Math.round(logoRgb[1] * coverage + backgroundRgb[1] * (1 - coverage));
            result.data[dataIndex + 2] = Math.round(logoRgb[2] * coverage + backgroundRgb[2] * (1 - coverage));
            result.data[dataIndex + 3] = 255;
          } else if (coverage &gt; 0) {
            result.data[dataIndex] = logoRgb[0];
            result.data[dataIndex + 1] = logoRgb[1];
            result.data[dataIndex + 2] = logoRgb[2];
            result.data[dataIndex + 3] = maskData[sourceIndex];
          }
        }
        target.putImageData(result, 0, 0);
      }

      function textureNoiseForSize(width, height) {
        if (width === canvasWidth &amp;&amp; height === canvasHeight) return textureNoise;
        const scaledNoise = new Uint8Array(width * height);
        for (let y = 0; y &lt; height; y += 1) {
          const sourceY = Math.min(canvasHeight - 1, Math.floor(y * canvasHeight / height));
          const sourceRow = sourceY * canvasWidth;
          const targetRow = y * width;
          for (let x = 0; x &lt; width; x += 1) {
            const sourceX = Math.min(canvasWidth - 1, Math.floor(x * canvasWidth / width));
            scaledNoise[targetRow + x] = textureNoise[sourceRow + sourceX];
          }
        }
        return scaledNoise;
      }

      function applyGrain(imageData, noise, amount) {
        if (amount &lt;= 0) return;
        const amplitude = amount * 1.15;
        for (let pixel = 0, dataIndex = 0; pixel &lt; noise.length; pixel += 1, dataIndex += 4) {
          if (imageData.data[dataIndex + 3] === 0) continue;
          const grain = ((((noise[pixel] * 73) + 41) &amp; 255) / 255 - 0.5) * amplitude;
          imageData.data[dataIndex] = Math.max(0, Math.min(255, Math.round(imageData.data[dataIndex] + grain)));
          imageData.data[dataIndex + 1] = Math.max(0, Math.min(255, Math.round(imageData.data[dataIndex + 1] + grain)));
          imageData.data[dataIndex + 2] = Math.max(0, Math.min(255, Math.round(imageData.data[dataIndex + 2] + grain)));
        }
      }

      function gaussianBoxSizes(sigma, passes) {
        const idealWidth = Math.sqrt((12 * sigma * sigma / passes) + 1);
        let lowerWidth = Math.floor(idealWidth);
        if (lowerWidth % 2 === 0) lowerWidth -= 1;
        const upperWidth = lowerWidth + 2;
        const idealPasses = (12 * sigma * sigma - passes * lowerWidth * lowerWidth - 4 * passes * lowerWidth - 3 * passes) / (-4 * lowerWidth - 4);
        const lowerPasses = Math.round(idealPasses);
        return Array.from({ length: passes }, (_, index) =&gt; index &lt; lowerPasses ? lowerWidth : upperWidth);
      }

      function boxBlurGray(source, width, height, radius) {
        if (radius &lt;= 0) return source.slice();
        const temporary = new Uint8Array(source.length);
        const result = new Uint8Array(source.length);
        const windowSize = radius * 2 + 1;

        for (let y = 0; y &lt; height; y += 1) {
          const row = y * width;
          let sum = 0;
          for (let offset = -radius; offset &lt;= radius; offset += 1) {
            sum += source[row + Math.max(0, Math.min(width - 1, offset))];
          }
          for (let x = 0; x &lt; width; x += 1) {
            temporary[row + x] = Math.round(sum / windowSize);
            const removeX = Math.max(0, x - radius);
            const addX = Math.min(width - 1, x + radius + 1);
            sum += source[row + addX] - source[row + removeX];
          }
        }

        for (let x = 0; x &lt; width; x += 1) {
          let sum = 0;
          for (let offset = -radius; offset &lt;= radius; offset += 1) {
            const sourceY = Math.max(0, Math.min(height - 1, offset));
            sum += temporary[sourceY * width + x];
          }
          for (let y = 0; y &lt; height; y += 1) {
            result[y * width + x] = Math.round(sum / windowSize);
            const removeY = Math.max(0, y - radius);
            const addY = Math.min(height - 1, y + radius + 1);
            sum += temporary[addY * width + x] - temporary[removeY * width + x];
          }
        }
        return result;
      }

      function manualGaussianBlur(source, width, height, amount) {
        if (amount &lt;= 0) return source.slice();
        let result = source.slice();
        gaussianBoxSizes(amount, 3).forEach((size) =&gt; {
          result = boxBlurGray(result, width, height, Math.max(0, (size - 1) / 2));
        });
        return result;
      }

      function hslToHex(hue, saturation, lightness) {
        const s = saturation / 100;
        const l = lightness / 100;
        const chroma = (1 - Math.abs(2 * l - 1)) * s;
        const section = hue / 60;
        const intermediate = chroma * (1 - Math.abs((section % 2) - 1));
        let red = 0;
        let green = 0;
        let blue = 0;
        if (section &lt; 1) [red, green, blue] = [chroma, intermediate, 0];
        else if (section &lt; 2) [red, green, blue] = [intermediate, chroma, 0];
        else if (section &lt; 3) [red, green, blue] = [0, chroma, intermediate];
        else if (section &lt; 4) [red, green, blue] = [0, intermediate, chroma];
        else if (section &lt; 5) [red, green, blue] = [intermediate, 0, chroma];
        else [red, green, blue] = [chroma, 0, intermediate];
        const match = l - chroma / 2;
        return `#${[red, green, blue].map((channel) =&gt; Math.round((channel + match) * 255).toString(16).padStart(2, &#x27;0&#x27;)).join(&#x27;&#x27;)}`;
      }

      function randomPaletteColor(hue) {
        const colorFamily = Math.floor(Math.random() * 10);
        if (colorFamily === 0) return &#x27;#000000&#x27;;
        if (colorFamily === 1) return &#x27;#ffffff&#x27;;
        const neonHue = (hue + (colorFamily - 2) * 45 + (Math.random() - 0.5) * 12 + 360) % 360;
        const coolHueBoost = neonHue &gt;= 190 &amp;&amp; neonHue &lt;= 300 ? 7 : 0;
        const lightness = Math.min(67, 52 + coolHueBoost + Math.random() * 8);
        return hslToHex(neonHue, 94 + Math.random() * 6, lightness);
      }

      function scheduleRender() {
        if (scheduledFrame !== null) cancelAnimationFrame(scheduledFrame);
        scheduledFrame = requestAnimationFrame(() =&gt; {
          scheduledFrame = null;
          renderNow();

      function scheduleSourceMask() {
        if (scheduledMaskFrame !== null) cancelAnimationFrame(scheduledMaskFrame);
        scheduledMaskFrame = requestAnimationFrame(() =&gt; {
          scheduledMaskFrame = null;
          prepareSourceMask();

      function measureTrackedLine(target, text, tracking) {
        const characters = Array.from(text);
        return characters.reduce((width, character, index) =&gt; {
          return width + target.measureText(character).width + (index &lt; characters.length - 1 ? tracking : 0);
        }, 0);
      }

      function drawTrackedLine(target, text, startX, y, tracking) {
        let cursor = startX;
        Array.from(text).forEach((character, index, characters) =&gt; {
          target.fillText(character, cursor, y);
          cursor += target.measureText(character).width;
          if (index &lt; characters.length - 1) cursor += tracking;
        });
      }

      function drawTextSource(target, width, height) {
        const resolutionScale = width / canvasWidth;
        const contentScale = sourceSizePercent / 100;
        const fontSize = Number(fontSizeInput.value) * resolutionScale * contentScale;
        const tracking = Number(letterSpacingInput.value) * resolutionScale * contentScale;
        const lineHeight = fontSize * Number(lineHeightInput.value) / 100;
        const lines = textContentInput.value.replace(/\r/g, &#x27;&#x27;).split(&#x27;\n&#x27;).slice(0, 6);
        const safeLines = lines.length ? lines : [&#x27;&#x27;];
        const anchorX = width / 2;
        const anchorY = height / 2;
        const firstBaseline = anchorY - (safeLines.length - 1) * lineHeight / 2;
        const family = fontFamilyInput.value.replace(/[&quot;\\]/g, &#x27;&#x27;);

        target.save();
        target.fillStyle = &#x27;#ffffff&#x27;;
        target.textBaseline = &#x27;middle&#x27;;
        target.font = `${fontWeightInput.value} ${fontSize}px &quot;${family}&quot;`;
        safeLines.forEach((line, index) =&gt; {
          const lineWidth = measureTrackedLine(target, line, tracking);
          let startX = anchorX - lineWidth / 2;
          if (textAlignInput.value === &#x27;left&#x27;) startX = anchorX;
          if (textAlignInput.value === &#x27;right&#x27;) startX = anchorX - lineWidth;
          drawTrackedLine(target, line, startX, firstBaseline + index * lineHeight, tracking);
        });
        target.restore();

        const slug = textContentInput.value.trim().replace(/[^a-z0-9]+/gi, &#x27;-&#x27;).replace(/^-|-$/g, &#x27;&#x27;).toLowerCase();
        sourceFileName = slug ? `testo-${slug}` : &#x27;testo&#x27;;
      }

      function prepareSourceMask() {
        raw.clearRect(0, 0, canvasWidth, canvasHeight);
        if (sourceMode === &#x27;text&#x27;) {
          drawTextSource(raw, canvasWidth, canvasHeight);
        } else {
          if (!sourceImage.naturalWidth || !sourceImage.naturalHeight) return;
          const padding = 86;
          const availableWidth = canvasWidth - padding * 2;
          const availableHeight = canvasHeight - padding * 2;
          const scale = Math.min(availableWidth / sourceImage.naturalWidth, availableHeight / sourceImage.naturalHeight) * (sourceSizePercent / 100);
          const drawWidth = sourceImage.naturalWidth * scale;
          const drawHeight = sourceImage.naturalHeight * scale;
          const drawX = (canvasWidth - drawWidth) / 2;
          const drawY = (canvasHeight - drawHeight) / 2;
          raw.drawImage(sourceImage, drawX, drawY, drawWidth, drawHeight);
        }
        const sourcePixels = raw.getImageData(0, 0, canvasWidth, canvasHeight);
        let transparentCount = 0;
        for (let index = 3; index &lt; sourcePixels.data.length; index += 4) {
          if (sourcePixels.data[index] &lt; 245) transparentCount += 1;
        }
        const useAlpha = transparentCount &gt; canvasWidth * canvasHeight * 0.01;
        const maskPixels = mask.createImageData(canvasWidth, canvasHeight);
        baseMaskIntensity = new Uint8Array(canvasWidth * canvasHeight);
        for (let index = 0, pixel = 0; index &lt; sourcePixels.data.length; index += 4, pixel += 1) {
          const alpha = sourcePixels.data[index + 3];
          const luminance = sourcePixels.data[index] * 0.2126 + sourcePixels.data[index + 1] * 0.7152 + sourcePixels.data[index + 2] * 0.0722;
          const value = useAlpha ? alpha : Math.round((255 - luminance) * (alpha / 255));
          baseMaskIntensity[pixel] = value;
          maskPixels.data[index] = value;
          maskPixels.data[index + 1] = value;
          maskPixels.data[index + 2] = value;
          maskPixels.data[index + 3] = 255;
        }
        mask.putImageData(maskPixels, 0, 0);
        blurIntensityCache.clear();
        sourceMaskReady = true;
        scheduleRender();
      }

      function intensityForBlur(amount) {
        if (blurIntensityCache.has(amount)) return blurIntensityCache.get(amount);
        let intensity;
        if (canvasFilterSupported) {
          blurred.clearRect(0, 0, canvasWidth, canvasHeight);
          blurred.save();
          blurred.filter = `blur(${amount}px)`;
          blurred.drawImage(maskCanvas, 0, 0);
          blurred.restore();
          const image = blurred.getImageData(0, 0, canvasWidth, canvasHeight).data;
          intensity = new Uint8Array(canvasWidth * canvasHeight);
          for (let pixel = 0, sourceIndex = 0; pixel &lt; intensity.length; pixel += 1, sourceIndex += 4) {
            intensity[pixel] = image[sourceIndex];
          }
        } else {
          intensity = manualGaussianBlur(baseMaskIntensity, canvasWidth, canvasHeight, amount);
        }
        blurIntensityCache.set(amount, intensity);
        return intensity;
      }

      function renderNow() {
        if (!sourceMaskReady) return;
        if (!effectToggle.checked) {
          paintSolidLogo(output, mask, canvasWidth, canvasHeight);
          return;
        }
        const result = output.createImageData(canvasWidth, canvasHeight);
        const backgroundEnabled = backgroundToggle.checked;
        const backgroundRgb = hexToRgb(backgroundColorInput.value);
        const textureEnabled = textureToggle.checked;
        if (backgroundEnabled) {
          for (let index = 0; index &lt; result.data.length; index += 4) {
            result.data[index] = backgroundRgb[0];
            result.data[index + 1] = backgroundRgb[1];
            result.data[index + 2] = backgroundRgb[2];
            result.data[index + 3] = 255;
          }
        }

        for (let layerIndex = layers.length - 1; layerIndex &gt;= 0; layerIndex -= 1) {
          const layer = layers[layerIndex];
          const intensity = intensityForBlur(layer.blur);
          const rgb = hexToRgb(layer.color);
          for (let pixel = 0, dataIndex = 0; pixel &lt; intensity.length; pixel += 1, dataIndex += 4) {
            if (intensity[pixel] &lt; layer.threshold) continue;
            result.data[dataIndex] = rgb[0];
            result.data[dataIndex + 1] = rgb[1];
            result.data[dataIndex + 2] = rgb[2];
            result.data[dataIndex + 3] = 255;
          }
        }
        if (textureEnabled) applyGrain(result, textureNoise, Number(grainInput.value));
        output.putImageData(result, 0, 0);
      }

      function buildHighResolutionExport() {
        const exportScale = 3;
        const width = canvasWidth * exportScale;
        const height = canvasHeight * exportScale;
        const exportCanvas = document.createElement(&#x27;canvas&#x27;);
        exportCanvas.width = width;
        exportCanvas.height = height;
        const exportOutput = exportCanvas.getContext(&#x27;2d&#x27;, { willReadFrequently: true });

        const exportRawCanvas = document.createElement(&#x27;canvas&#x27;);
        exportRawCanvas.width = width;
        exportRawCanvas.height = height;
        const exportRaw = exportRawCanvas.getContext(&#x27;2d&#x27;, { willReadFrequently: true });
        if (sourceMode === &#x27;text&#x27;) {
          drawTextSource(exportRaw, width, height);
        } else {
          const padding = 86 * exportScale;
          const availableWidth = width - padding * 2;
          const availableHeight = height - padding * 2;
          const sourceScale = Math.min(availableWidth / sourceImage.naturalWidth, availableHeight / sourceImage.naturalHeight) * (sourceSizePercent / 100);
          const drawWidth = sourceImage.naturalWidth * sourceScale;
          const drawHeight = sourceImage.naturalHeight * sourceScale;
          const drawX = (width - drawWidth) / 2;
          const drawY = (height - drawHeight) / 2;
          exportRaw.drawImage(sourceImage, drawX, drawY, drawWidth, drawHeight);
        }
        let sourcePixels = exportRaw.getImageData(0, 0, width, height);
        let transparentCount = 0;
        for (let index = 3; index &lt; sourcePixels.data.length; index += 4) {
          if (sourcePixels.data[index] &lt; 245) transparentCount += 1;
        }
        const useAlpha = transparentCount &gt; width * height * 0.01;

        const exportMaskCanvas = document.createElement(&#x27;canvas&#x27;);
        exportMaskCanvas.width = width;
        exportMaskCanvas.height = height;
        const exportMask = exportMaskCanvas.getContext(&#x27;2d&#x27;, { willReadFrequently: true });
        let maskPixels = exportMask.createImageData(width, height);
        const exportBaseIntensity = new Uint8Array(width * height);
        for (let index = 0, pixel = 0; index &lt; sourcePixels.data.length; index += 4, pixel += 1) {
          const alpha = sourcePixels.data[index + 3];
          const luminance = sourcePixels.data[index] * 0.2126 + sourcePixels.data[index + 1] * 0.7152 + sourcePixels.data[index + 2] * 0.0722;
          const value = useAlpha ? alpha : Math.round((255 - luminance) * (alpha / 255));
          exportBaseIntensity[pixel] = value;
          maskPixels.data[index] = value;
          maskPixels.data[index + 1] = value;
          maskPixels.data[index + 2] = value;
          maskPixels.data[index + 3] = 255;
        }
        exportMask.putImageData(maskPixels, 0, 0);
        sourcePixels = null;
        maskPixels = null;

        if (!effectToggle.checked) {
          paintSolidLogo(exportOutput, exportMask, width, height);
          return exportCanvas;
        }

        const result = exportOutput.createImageData(width, height);
        const textureEnabled = textureToggle.checked;
        const exportTextureNoise = textureEnabled ? textureNoiseForSize(width, height) : null;
        if (backgroundToggle.checked) {
          const backgroundRgb = hexToRgb(backgroundColorInput.value);
          for (let index = 0; index &lt; result.data.length; index += 4) {
            result.data[index] = backgroundRgb[0];
            result.data[index + 1] = backgroundRgb[1];
            result.data[index + 2] = backgroundRgb[2];
            result.data[index + 3] = 255;
          }
        }

        const exportBlurCanvas = document.createElement(&#x27;canvas&#x27;);
        exportBlurCanvas.width = width;
        exportBlurCanvas.height = height;
        const exportBlur = exportBlurCanvas.getContext(&#x27;2d&#x27;, { willReadFrequently: true });
        for (let layerIndex = layers.length - 1; layerIndex &gt;= 0; layerIndex -= 1) {
          const layer = layers[layerIndex];
          let intensity;
          if (canvasFilterSupported) {
            exportBlur.clearRect(0, 0, width, height);
            exportBlur.save();
            exportBlur.filter = `blur(${layer.blur * exportScale}px)`;
            exportBlur.drawImage(exportMaskCanvas, 0, 0);
            exportBlur.restore();
            const rgbaIntensity = exportBlur.getImageData(0, 0, width, height).data;
            intensity = new Uint8Array(width * height);
            for (let pixel = 0, sourceIndex = 0; pixel &lt; intensity.length; pixel += 1, sourceIndex += 4) {
              intensity[pixel] = rgbaIntensity[sourceIndex];
            }
          } else {
            intensity = manualGaussianBlur(exportBaseIntensity, width, height, layer.blur * exportScale);
          }
          const rgb = hexToRgb(layer.color);
          for (let pixel = 0, dataIndex = 0; pixel &lt; intensity.length; pixel += 1, dataIndex += 4) {
            if (intensity[pixel] &lt; layer.threshold) continue;
            result.data[dataIndex] = rgb[0];
            result.data[dataIndex + 1] = rgb[1];
            result.data[dataIndex + 2] = rgb[2];
            result.data[dataIndex + 3] = 255;
          }
        }
        if (textureEnabled) applyGrain(result, exportTextureNoise, Number(grainInput.value));
        exportOutput.putImageData(result, 0, 0);
        return exportCanvas;
      }

      function refreshEditor() {
        const layer = selectedLayer();
        blurInput.value = String(layer.blur);

        thresholdInput.value = String(expansion);
        thresholdValue.textContent = String(expansion);

        addButton.disabled = layers.length &gt;= maxLayers;

      function clearDropIndicator() {
        layerList.querySelectorAll(&#x27;.drop-before, .drop-after&#x27;).forEach((row) =&gt; {
          row.classList.remove(&#x27;drop-before&#x27;, &#x27;drop-after&#x27;);

      function finishLayerDrag() {

        root.querySelectorAll(&#x27;.layer-drag-preview&#x27;).forEach((preview) =&gt; preview.remove());
        draggedLayerId = null;
        dropInsertionIndex = null;
      }

      function dropLayer() {
        const fromIndex = layers.findIndex((layer) =&gt; layer.id === draggedLayerId);
        if (fromIndex &lt; 0 || dropInsertionIndex === null) {
          finishLayerDrag();
          return;
        }
        let toIndex = dropInsertionIndex;
        const [moved] = layers.splice(fromIndex, 1);
        if (toIndex &gt; fromIndex) toIndex -= 1;
        layers.splice(Math.max(0, Math.min(toIndex, layers.length)), 0, moved);
        finishLayerDrag();
        rebuildLayerList();
        scheduleRender();
      }

      function rebuildLayerList() {
        layerList.replaceChildren();
        layers.forEach((layer, index) =&gt; {
          const row = document.createElement(&#x27;div&#x27;);
          row.className = &#x27;layer-row&#x27;;
          row.dataset.index = String(index);
          row.draggable = true;

          const handle = document.createElement(&#x27;span&#x27;);
          handle.className = &#x27;layer-handle&#x27;;
          handle.textContent = &#x27;⠿&#x27;;
          handle.setAttribute(&#x27;aria-hidden&#x27;, &#x27;true&#x27;);

          const entry = document.createElement(&#x27;div&#x27;);
          entry.className = &#x27;layer-entry&#x27;;

          const select = document.createElement(&#x27;button&#x27;);
          select.className = &#x27;btn btn-block layer-select&#x27;;
          select.type = &#x27;button&#x27;;
          select.draggable = true;
          select.setAttribute(&#x27;aria-pressed&#x27;, String(layer.id === selectedLayerId));
          const copy = document.createElement(&#x27;span&#x27;);
          copy.className = &#x27;layer-copy&#x27;;

          name.textContent = `Livello ${index + 1}`;

          const layerColorInput = document.createElement(&#x27;input&#x27;);
          layerColorInput.className = &#x27;form-control form-control-color layer-color-input&#x27;;
          layerColorInput.type = &#x27;color&#x27;;
          layerColorInput.value = layer.color;
          layerColorInput.classList.toggle(&#x27;is-white&#x27;, layer.color.toLowerCase() === &#x27;#ffffff&#x27;);

          layerColorInput.addEventListener(&#x27;pointerdown&#x27;, (event) =&gt; event.stopPropagation());
          layerColorInput.addEventListener(&#x27;dragstart&#x27;, (event) =&gt; event.preventDefault());

          entry.append(select, layerColorInput);

          row.addEventListener(&#x27;dragstart&#x27;, (event) =&gt; {
            draggedLayerId = layer.id;
            dropInsertionIndex = index;
            event.dataTransfer.effectAllowed = &#x27;move&#x27;;
            event.dataTransfer.setData(&#x27;text/plain&#x27;, String(layer.id));
            const preview = row.cloneNode(true);
            preview.classList.add(&#x27;layer-drag-preview&#x27;);

            root.append(preview);
            event.dataTransfer.setDragImage(preview, 28, Math.max(18, preview.getBoundingClientRect().height / 2));

      sourceImage.onload = () =&gt; prepareSourceMask();
      sourceImage.src = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(clientLogoSvg)}`;
      refreshTextureControls();

  &lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {

    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
